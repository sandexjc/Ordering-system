<div class="modal fade" id="user-role-confirm-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
	<div class="modal-dialog modal-sm fixed-min-width">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Потвърждение</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<form method="post" id="user-role-confirm-form">
				{% csrf_token %}
				<input type="hidden" name="role" id="user-role-confirm-role" value="">
				<div class="modal-body" style="text-align: center;">
					<h5 class="user-role-confirm-text mb-0"></h5>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отказ</button>
					<button type="submit" class="btn btn-primary">Промени</button>
				</div>
			</form>
		</div>
	</div>
</div>
