<div class="modal fade" id="send-password-email-confirm-{{ listed_user.pk }}" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
	<div class="modal-dialog modal-sm fixed-min-width">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Потвърждение</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<form method="post" action="{% url 'accounts:send-set-password-email' listed_user.pk %}" class="send-password-email-form" data-status-button="send-password-email-status-{{ listed_user.pk }}" data-username="{{ listed_user.username }}">
				{% csrf_token %}
				<div class="modal-body" style="text-align: center;">
					<h5>
						Сигурни ли сте, че искате да изпратите имейл за смяна на паролата на този потребител: <strong>{{ listed_user.username }}</strong>?
					</h5>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отказ</button>
					<button type="submit" class="btn btn-primary">Изпрати</button>
				</div>
			</form>
		</div>
	</div>
</div>
