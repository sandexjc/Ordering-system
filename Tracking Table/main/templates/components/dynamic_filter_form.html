<!-- Dynamic filter form: category | options | calendar -->
<div class="collapse" id="collapseExample" style="margin-top: 20px;">
    <div class="card card-body">
        <div class="row g-3 align-items-start">
            <!-- Category switcher -->
            <div class="col-md-4">
                <div class="btn-group-vertical w-100" role="group" aria-label="Филтър категории">
                    <input type="radio" class="btn-check" name="filter-category" id="filter-cat-sort" value="sort" autocomplete="off" checked>
                    <label class="btn btn-outline-primary" for="filter-cat-sort">Сортиране</label>

                    <input type="radio" class="btn-check" name="filter-category" id="filter-cat-date" value="date" autocomplete="off">
                    <label class="btn btn-outline-primary" for="filter-cat-date">Дата</label>

                    <input type="radio" class="btn-check" name="filter-category" id="filter-cat-type" value="type" autocomplete="off">
                    <label class="btn btn-outline-primary" for="filter-cat-type">Тип</label>
                </div>
            </div>

            <!-- Category options -->
            <div class="col-md-4">
                <div data-filter-panel="sort">
                    <div class="btn-group-vertical w-100" role="group" aria-label="Ред на показване">
                        <input type="radio" class="btn-check" name="filter-sort" id="filter-sort-desc" value="desc" autocomplete="off" checked>
                        <label class="btn btn-outline-primary" for="filter-sort-desc">Низходящо</label>

                        <input type="radio" class="btn-check" name="filter-sort" id="filter-sort-asc" value="asc" autocomplete="off">
                        <label class="btn btn-outline-primary" for="filter-sort-asc">Възходящо</label>
                    </div>
                </div>

                <div data-filter-panel="date" class="d-none">
                    <div class="btn-group-vertical w-100" role="group" aria-label="Избор на период">
                        <input type="radio" class="btn-check" name="filter-date-target" id="filter-date-start" value="start" autocomplete="off">
                        <label class="btn btn-outline-primary text-start" for="filter-date-start">
                            Начална дата
                            <small class="d-block text-muted" id="filter-start-display">—</small>
                        </label>

                        <input type="radio" class="btn-check" name="filter-date-target" id="filter-date-end" value="end" autocomplete="off">
                        <label class="btn btn-outline-primary text-start" for="filter-date-end">
                            Крайна дата
                            <small class="d-block text-muted" id="filter-end-display">—</small>
                        </label>
                    </div>
                </div>

                <div data-filter-panel="type" class="d-none">
                    <div class="d-flex flex-column gap-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filter-type-order" value="order" checked>
                            <label class="form-check-label" for="filter-type-order">Поръчка</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filter-type-offer" value="offer">
                            <label class="form-check-label" for="filter-type-offer">Оферта</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Calendar slot (Date category only) -->
            <div class="col-md-4">
                <div id="dynamic-filter-calendar-panel" class="d-none">
                    <label class="form-label" id="dynamic-filter-calendar-label" for="dynamic-filter-date-input">Изберете дата</label>
                    <input type="date" class="form-control" id="dynamic-filter-date-input">
                </div>
            </div>
        </div>
    </div>
</div>
