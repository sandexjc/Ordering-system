<div class="collapse" id="collapseExample" style="margin-top: 20px;">
    <div class="card dynamic-filter-card">
        <div class="card-body dynamic-filter-card-body">
            <div class="row align-items-start dynamic-filter-row">
                <div class="col-md-4 dynamic-filter-col">
                    <div class="btn-group-vertical w-100 dynamic-filter-btn-group" role="group" aria-label="Филтър категории">
                        <input type="radio" class="btn-check" name="filter-category" id="filter-cat-date" value="date" autocomplete="off" checked>
                        <label class="btn btn-outline-primary" for="filter-cat-date">Период</label>

                        <input type="radio" class="btn-check" name="filter-category" id="filter-cat-type" value="type" autocomplete="off">
                        <label class="btn btn-outline-primary" for="filter-cat-type">Тип</label>
                    </div>
                </div>
                <div class="col-md-4 dynamic-filter-col">
                    <div data-filter-panel="date">
                        <div class="btn-group-vertical w-100 dynamic-filter-btn-group" role="group" aria-label="Избор на период">
                            <input type="radio" class="btn-check" name="filter-date-target" id="filter-date-start" value="start" autocomplete="off">
                            <label class="btn btn-outline-primary text-start" for="filter-date-start">
                                Начална дата
                                <small class="d-block text-muted" id="filter-start-display">—</small>
                            </label>

                            <input type="radio" class="btn-check" name="filter-date-target" id="filter-date-end" value="end" autocomplete="off">
                            <label class="btn btn-outline-primary text-start" for="filter-date-end">
                                Крайна дата
                                <small class="d-block text-muted" id="filter-end-display">—</small>
                            </label>
                        </div>
                    </div>
                    <div data-filter-panel="type" class="d-none">
                        <div class="btn-group-vertical w-100 dynamic-filter-btn-group" role="group" aria-label="Тип поръчки">
                            <input type="checkbox" class="btn-check" id="filter-type-order" value="order" autocomplete="off" checked>
                            <label class="btn btn-outline-primary" for="filter-type-order">Поръчки</label>

                            <input type="checkbox" class="btn-check" id="filter-type-offer" value="offer" autocomplete="off">
                            <label class="btn btn-outline-primary" for="filter-type-offer">Оферти</label>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 dynamic-filter-col">
                    <div id="dynamic-filter-calendar-panel" class="d-none">
                        <label class="form-label" id="dynamic-filter-calendar-label" for="dynamic-filter-date-input">Изберете дата</label>
                        <input type="date" class="form-control" id="dynamic-filter-date-input">
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-center mt-3">
                <button type="button" class="btn btn-primary btn-sm" id="dynamic-filter-reset" disabled>
                    Премахни филтъра
                </button>
            </div>
        </div>
    </div>
</div>
