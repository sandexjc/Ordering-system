<div class="collapse" id="dynamic-summarize-collapse" style="margin-top: 20px;">
    <div class="card dynamic-filter-card dynamic-summarize-card">
        <div class="card-body dynamic-filter-card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-sm mb-0 dynamic-summarize-table">
                    <thead>
                        <tr>
                            <th scope="col">
                                <label class="dynamic-summarize-select-all mb-0" for="summarize-select-all">
                                    <input
                                        type="checkbox"
                                        class="form-check-input"
                                        id="summarize-select-all"
                                        title="Избери всички заредени поръчки"
                                    >
                                    Избрани поръчки
                                </label>
                            </th>
                            <th scope="col">Клиенти</th>
                            <th scope="col">Плочи</th>
                            <th scope="col">Кант</th>
                            <th scope="col">Баланс</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="summarize-count">0</td>
                            <td id="summarize-clients"></td>
                            <td id="summarize-plates"></td>
                            <td id="summarize-edges"></td>
                            <td></td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <th scope="row">Общо</th>
                            <td></td>
                            <td id="summarize-plates-total">0</td>
                            <td id="summarize-edges-total">0</td>
                            <td id="summarize-balance">0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>
