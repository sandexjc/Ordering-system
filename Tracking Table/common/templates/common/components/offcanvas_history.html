{% load static %}

<div id="offcanvas-history-tab-{{ object.id }}">
    <div class="offcanvas offcanvas-end history-panel" tabindex="-1" id="history-tab-{{ object.id }}">
        <div class="offcanvas-header history-panel-header">
            <h5 class="offcanvas-title">
                История за поръчка №{{ object.id }}
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body" id="{{ object.id }}" pulled="False">
            <div id="history-lines-{{ object.id }}" class="history-lines">
                <div class="d-flex justify-content-center" style="margin-top: 100%;">
                    <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
            <div class="history-refresh-wrap">
                <button class="btn history-refresh-btn" id="historyRefresh{{ object.id }}" type="button" data-history-refresh="{{ object.id }}" title="Refresh">
                    <img src="{% static 'images/refresh.png' %}" class="history-refresh-icon" alt="">
                </button>
            </div>
        </div>
    </div>
</div>
