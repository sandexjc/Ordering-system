<tr class="order-form-item-row">
	{{ item.id }}
	<td>{{ item.material }}</td>
	<td>{{ item.manufacturer }}</td>
	<td>
		<div class="form-check form-switch" style="margin-left: 19px; margin-top: 5px;">
			{{ item.from_client }}
		</div>
	</td>
	<td>{{ item.quantity }}</td>
	<td>
		<div class="input-group input-group-sm">
			{{ item.price }}<span class="input-group-text">{{ currency }}</span>
		</div>
	</td>
	<td class="order-form-last-cell">
		<div class="input-group input-group-sm">
			{{ item.value }}<span class="input-group-text">{{ currency }}</span>
		</div>
		{% include "table/components/order_form_row_action.html" with item=item %}
	</td>
</tr>
